name: Bug Report
description: Report a bug in tvos-cobalt-userscript
labels: ["bug"]
body:
  - type: input
    id: env
    attributes:
      label: Host OS, Python/uv Version & Target Profile
      placeholder: "macOS 15, Python 3.12, youtube-tvos-4.54.01"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps & Error Output
      description: Paste sanitized CLI command and error output (do NOT upload copyrighted IPAs or credentials).
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance & Privacy Check
      options:
        - label: I have NOT attached any proprietary IPA, binary, icon asset, or FairPlay credential.
          required: true
