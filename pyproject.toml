[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tvos-cobalt-userscript"
version = "0.1.0"
description = "Clean-room userscript loader patcher for Cobalt-based tvOS apps (local hot-reload, CSP whitelist, side-by-side bundle ID & icon inversion)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Comic Chang" }]
keywords = ["tvos", "apple-tv", "cobalt", "userscript", "patcher", "arm64"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "capstone>=5.0.6",
    "lief>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cobalt-patcher = "cobalt_patcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cobalt_patcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
